<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="K5LY · Brand Creative × AI Explorer × Digital Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101F30"/>
      <stop offset="1" stop-color="#0B1725"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#D4A574" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A574" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4A574" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D4A574" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- top edge highlight -->
  <rect x="0" y="0" width="1200" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- wordmark -->
  <text x="592" y="158" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="82" font-weight="500" letter-spacing="18" fill="#F7F5F2">K5LY</text>

  <!-- hairline -->
  <rect x="570" y="192" width="60" height="1" fill="url(#hairline)"/>

  <!-- tagline -->
  <text x="600" y="238" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400" letter-spacing="9" fill="#D4A574" fill-opacity="0.88">STORIES · SYSTEMS · EXPERIMENTS</text>
</svg>
