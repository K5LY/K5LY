<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="50%" style="stop-color:#1B2D4A"/>
      <stop offset="100%" style="stop-color:#0D1B2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#E8C9A0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#bg)"/>
  <rect x="0" y="0" width="4" height="200" fill="url(#accent)"/>
  <g transform="translate(60,100)">
    <text x="0" y="-10" fill="#E8C9A0" font-family="system-ui,-apple-system,sans-serif" font-size="14" letter-spacing="4" text-transform="uppercase" opacity="0.7">K5LY</text>
    <text x="0" y="30" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="700" letter-spacing="2">Brand Creative × AI Explorer</text>
    <text x="0" y="60" fill="#D4A574" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" letter-spacing="1">Building stories, systems &amp; experiments at the intersection of creativity and technology</text>
  </g>
  <g transform="translate(1080,100)" text-anchor="end">
    <text x="0" y="-10" fill="#4A5568" font-family="system-ui,-apple-system,sans-serif" font-size="12" letter-spacing="2">DIGITAL BUILDER</text>
    <text x="0" y="14" fill="#6A7A8A" font-family="system-ui,-apple-system,sans-serif" font-size="11" letter-spacing="1">EST. 2026</text>
  </g>
