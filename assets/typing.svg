<svg xmlns="http://www.w3.org/2000/svg" width="600" height="60" viewBox="0 0 600 60">
  <defs>
    <style>
      .cursor { font-family: system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 600; fill: #D4A574; animation: blink 1s infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
  </defs>
  <text x="300" y="42" class="cursor">│</text>
