<svg xmlns="http://www.w3.org/2000/svg" width="600" height="60" viewBox="0 0 600 60">
  <defs>
    <style>
      .typing-text { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 600; fill: #D4A574; }
      .cursor { fill: #D4A574; animation: blink 1s infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
  </defs>
  <text x="0" y="42" class="typing-text">Brand Designer</text>
  <text x="380" y="42" class="cursor">│</text>
</svg>