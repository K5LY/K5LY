<svg xmlns="http://www.w3.org/2000/svg" width="800" height="124" viewBox="0 0 800 124" role="img" aria-label="Brand Creative · AI Explorer · Digital Builder">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#16304F"/>
    </linearGradient>
    <linearGradient id="lgFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="lgEdge" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="mb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="mb2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="c1"><rect x="38" y="40" width="236" height="44" rx="22"/></clipPath>
    <clipPath id="c2"><rect x="288" y="40" width="224" height="44" rx="22"/></clipPath>
    <clipPath id="c3"><rect x="526" y="40" width="236" height="44" rx="22"/></clipPath>
  </defs>

  <rect x="2" y="2" width="796" height="120" rx="30" fill="url(#panel)"/>
  <rect x="2.5" y="2.5" width="795" height="119" rx="29.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <ellipse cx="660" cy="118" rx="200" ry="40" fill="#8A6A44" opacity="0.30" filter="url(#mb2)"/>
  <ellipse cx="120" cy="14" rx="180" ry="30" fill="#3A5A82" opacity="0.5" filter="url(#mb2)"/>

  <!-- chip 1 -->
  <g>
    <rect x="38" y="40" width="236" height="44" rx="22" fill="url(#lgFill)" stroke="url(#lgEdge)" stroke-width="1.2"/>
    <g clip-path="url(#c1)">
      <ellipse cx="90" cy="86" rx="60" ry="16" fill="#D4A574" opacity="0.30" filter="url(#mb)"/>
      <ellipse cx="230" cy="40" rx="60" ry="14" fill="#6E8BB0" opacity="0.35" filter="url(#mb)"/>
    </g>
    <ellipse cx="96" cy="47" rx="34" ry="4.5" fill="#FFFFFF" opacity="0.55"/>
    <text x="156" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F0E4CE" letter-spacing="1">Brand Creative</text>
  </g>
  <!-- chip 2 -->
  <g>
    <rect x="288" y="40" width="224" height="44" rx="22" fill="url(#lgFill)" stroke="url(#lgEdge)" stroke-width="1.2"/>
    <g clip-path="url(#c2)">
      <ellipse cx="340" cy="86" rx="56" ry="16" fill="#D4A574" opacity="0.30" filter="url(#mb)"/>
      <ellipse cx="470" cy="40" rx="56" ry="14" fill="#6E8BB0" opacity="0.35" filter="url(#mb)"/>
    </g>
    <ellipse cx="344" cy="47" rx="32" ry="4.5" fill="#FFFFFF" opacity="0.55"/>
    <text x="400" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F0E4CE" letter-spacing="1">AI Explorer</text>
  </g>
  <!-- chip 3 -->
  <g>
    <rect x="526" y="40" width="236" height="44" rx="22" fill="url(#lgFill)" stroke="url(#lgEdge)" stroke-width="1.2"/>
    <g clip-path="url(#c3)">
      <ellipse cx="580" cy="86" rx="60" ry="16" fill="#D4A574" opacity="0.30" filter="url(#mb)"/>
      <ellipse cx="720" cy="40" rx="60" ry="14" fill="#6E8BB0" opacity="0.35" filter="url(#mb)"/>
    </g>
    <ellipse cx="584" cy="47" rx="34" ry="4.5" fill="#FFFFFF" opacity="0.55"/>
    <text x="644" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F0E4CE" letter-spacing="1">Digital Builder</text>
  </g>
</svg>
